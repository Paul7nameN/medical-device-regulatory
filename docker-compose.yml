services:
  db:
    image: postgres:16-alpine
    container_name: med_therm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: med_therm_user
      POSTGRES_PASSWORD: med_therm_password
      POSTGRES_DB: med_therm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U med_therm_user -d med_therm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: med_therm_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://med_therm_user:med_therm_password@db:5432/med_therm
      DATABASE_URL_ASYNC: postgresql+asyncpg://med_therm_user:med_therm_password@db:5432/med_therm
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:5173", "http://frontend:5173"]'
      MODELARK_BASE_URL: https://ark.ap-southeast.bytepluses.com/api/v3
      MODELARK_API_KEY: ${MODELARK_API_KEY:-}
      MODEL_CHART_ANALYSIS: seed-2-0-pro-260328
      MODEL_TEXT_ANALYSIS: seed-2-0-pro-260328
       # AI_ENABLED nu este setat aici - se determina automat din config.py:
       # Daca MODELARK_API_KEY exista si nu este gol, atunci ai_enabled=True automat
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.venv
    command: >
      sh -c "if [ ! -f alembic.ini ]; then
               echo '[alembic]' > alembic.ini;
               echo 'script_location = migrations' >> alembic.ini;
               echo 'sqlalchemy.url = postgresql://' >> alembic.ini;
             fi;
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: med_therm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
