# Alembic configuration file
# NOTA: sqlalchemy.url de aici NU este folosit!
# Este suprascris in migrations/env.py din variabila de mediu DATABASE_URL_ASYNC

[alembic]
script_location = migrations
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/med_therm

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
