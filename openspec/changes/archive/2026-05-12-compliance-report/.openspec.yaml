change:
  name: compliance-report
  schema: spec-driven
  created: 2026-05-12
  description: Python module that aggregates results from log-parser, regulatory-engine, and ai-analysis to produce structured compliance reports containing: violations list mapped to REG-* codes, severity classification (critical/major/minor/info), temporal analysis of events, and actionable recommendations. Critical violations include: REG-TEMP-1 exceedances, REG-SENS-1 redundancy failures, REG-ALARM-1 delayed alarms

